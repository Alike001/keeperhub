name: Issue 1840 reviewer fix

on:
  push:
    branches:
      - fix/issue-1840-release-key-on-definite-failure
    paths:
      - scripts/issue1840_reviewer_fix.py
      - scripts/issue1840_test_patch.py
      - .github/workflows/issue1840-reviewer-fix.yml

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-1840-release-key-on-definite-failure
          fetch-depth: 0

      - name: Apply exact reviewer patch
        run: |
          python3 scripts/issue1840_reviewer_fix.py
          python3 scripts/issue1840_test_patch.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Targeted regression tests
        run: >-
          pnpm vitest run
          tests/unit/idempotency-disposition-evidence.test.ts
          tests/unit/execute-protocol-idempotency-disposition.test.ts
          tests/unit/submit-signed-solana.test.ts
          tests/unit/tempo-dex-swap.test.ts
          tests/unit/tempo-batch-payout.test.ts
          tests/unit/tempo-transfer-with-memo.test.ts

      - name: Type check
        run: pnpm type-check

      - name: Biome changed production and test files
        run: |
          pnpm biome check \
            lib/idempotency-disposition.ts \
            lib/web3/submit-signed-solana.ts \
            lib/web3/chain-adapter/solana.ts \
            plugins/web3/steps/approve-token-core.ts \
            plugins/web3/steps/batch-write-contract-core.ts \
            plugins/web3/steps/write-contract-core.ts \
            plugins/web3/steps/transfer-token-core.ts \
            plugins/web3/steps/transfer-funds-core.ts \
            plugins/web3/steps/transfer-spl-token-core.ts \
            plugins/robinhood/steps/trade-stock-token-core.ts \
            plugins/tempo/steps/tempo-tx-core.ts \
            plugins/tempo/steps/dex-swap.ts \
            plugins/tempo/steps/transfer-with-memo.ts \
            plugins/tempo/steps/batch-payout.ts \
            app/api/execute/transfer/route.ts \
            tests/unit/idempotency-disposition-evidence.test.ts \
            tests/unit/execute-protocol-idempotency-disposition.test.ts \
            tests/unit/submit-signed-solana.test.ts

      - name: Remove one-shot machinery
        run: |
          rm scripts/issue1840_reviewer_fix.py
          rm scripts/issue1840_test_patch.py
          rm .github/workflows/issue1840-reviewer-fix.yml

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: close broadcast evidence gaps for #1840"
          git push origin HEAD:fix/issue-1840-release-key-on-definite-failure
