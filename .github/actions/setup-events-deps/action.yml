name: Setup events workspace deps
description: Install Node, pnpm, and dependencies for the keeperhub-events pnpm workspace.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "22"

    - name: Setup pnpm
      # No version input: pnpm/action-setup resolves the exact version from
      # the packageManager field in the root package.json, and errors if both
      # are set. Pinning in one place keeps CI and local installs on the same
      # pnpm major, which patchedDependencies hashes depend on.
      uses: pnpm/action-setup@v4

    - name: Get pnpm store directory
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v5
      with:
        path: ${{ env.STORE_PATH }}
        # Key only on the events lockfile so main-app lockfile churn does
        # not invalidate the events cache.
        key: ${{ runner.os }}-pnpm-events-${{ hashFiles('keeperhub-events/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-events-

    - name: Install events deps
      shell: bash
      working-directory: keeperhub-events
      run: pnpm install --frozen-lockfile
